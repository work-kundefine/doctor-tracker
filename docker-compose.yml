version: '3.8'

services:
  # -------------------------------------------------------------
  # MongoDB Database Service
  # -------------------------------------------------------------
  mongodb:
    image: mongo:7.0
    container_name: doctortracker-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      - MONGO_INITDB_DATABASE=doctortracker
    volumes:
      - mongo_data:/data/db
    networks:
      - doctortracker-network
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --eval "db.adminCommand(\"ping\")" || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------
  # Standalone Node.js + Express Backend API Service
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doctortracker-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/doctortracker
      - JWT_SECRET=clinical_intelligence_doctortracker_jwt_secret_token_2026
      - JWT_EXPIRES_IN=12h
      - CORS_ORIGIN=http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - doctortracker-network

  # -------------------------------------------------------------
  # Standalone Next.js Frontend Application Service
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doctortracker-frontend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - BACKEND_API_URL=http://backend:5000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    depends_on:
      backend:
        condition: service_started
    networks:
      - doctortracker-network

# -------------------------------------------------------------
# Persistent Volumes
# -------------------------------------------------------------
volumes:
  mongo_data:
    driver: local

# -------------------------------------------------------------
# Network Bridge
# -------------------------------------------------------------
networks:
  doctortracker-network:
    driver: bridge
